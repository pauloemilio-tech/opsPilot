<div class="app-shell">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" routerLink="/">
        <img
          [src]="
            themeService.theme() === 'light'
              ? '/assets/opsPilot.logoLight.png'
              : '/assets/opsPilot.logoDark.png'
          "
          alt="OpsPilot — Signal workspace"
        />
      </a>
      <nav aria-label="Primary navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          Home
        </a>
        <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">
          Dashboard
        </a>
      </nav>
      <div class="header-actions">
        <app-theme-toggle />
      </div>
    </div>
  </header>
  <main id="main-content" class="app-main" tabindex="-1"><router-outlet /></main>
</div>
