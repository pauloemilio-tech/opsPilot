spring:
  application:
    name: opspilot-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opspilot}
    username: ${DB_USER:opspilot}
    password: ${DB_PASSWORD:opspilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

opspilot:
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:https://api.anthropic.com/v1}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
    max-tokens: ${AI_MAX_TOKENS:1200}
