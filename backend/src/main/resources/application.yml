spring:
  application:
    name: opspilot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opspilot}}
    username: ${DB_USER:opspilot}
    password: ${DB_PASSWORD:opspilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:${PORT:8080}}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

opspilot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:https://api.anthropic.com/v1}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
    max-tokens: ${AI_MAX_TOKENS:1200}
    demo-rate-limit:
      enabled: ${AI_DEMO_RATE_LIMIT_ENABLED:false}
      max-requests-per-visitor-per-day: ${AI_DEMO_MAX_REQUESTS_PER_VISITOR_PER_DAY:2}
      max-requests-per-day: ${AI_DEMO_MAX_REQUESTS_PER_DAY:10}
      cooldown-seconds: ${AI_DEMO_COOLDOWN_SECONDS:60}
      trust-forwarded-headers: ${AI_DEMO_TRUST_FORWARDED_HEADERS:false}
      visitor-hash-secret: ${AI_DEMO_VISITOR_HASH_SECRET:change-me-in-production}
